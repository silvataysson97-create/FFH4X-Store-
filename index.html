<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fusion XIT Store</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#050b18;
  color:#fff;
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#07152f,#102d63);
  padding:22px 15px;
  text-align:center;
  border-bottom:1px solid #1d4fa3;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#00aaff;
  text-shadow:0 0 12px #008cff;
  cursor:pointer;
  user-select:none;
}

.subtitle{
  margin-top:6px;
  color:#a9c7ef;
  font-size:13px;
}

.container{
  max-width:600px;
  margin:auto;
  padding:15px;
}

.cart-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.cart-btn{
  background:#087cff;
  border:0;
  color:#fff;
  padding:11px 15px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.products{
  display:grid;
  gap:12px;
}

.card{
  background:#0b1428;
  border:1px solid #183866;
  border-radius:14px;
  padding:15px;
  box-shadow:0 0 12px rgba(0,120,255,.12);
}

.card h3{
  color:#fff;
  margin-bottom:7px;
}

.card p{
  color:#a9b8d0;
  font-size:13px;
  line-height:1.4;
  margin-bottom:10px;
}

.price{
  color:#00d084;
  font-size:20px;
  font-weight:bold;
}

.stock{
  color:#8da5c7;
  font-size:12px;
  margin:5px 0 10px;
}

.buy{
  width:100%;
  border:0;
  background:#087cff;
  color:white;
  padding:12px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.buy:disabled{
  background:#333b49;
  cursor:not-allowed;
}

.notice{
  margin-top:15px;
  text-align:center;
  color:#8295b5;
  font-size:11px;
}

.section{
  background:#0b1428;
  border:1px solid #183866;
  border-radius:14px;
  padding:15px;
  margin-top:15px;
}

.section h2{
  font-size:18px;
  margin-bottom:12px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #1b2c49;
  font-size:14px;
}

.total{
  display:flex;
  justify-content:space-between;
  margin-top:12px;
  font-weight:bold;
  font-size:18px;
}

.pix-box{
  background:#061b17;
  border:1px solid #00a878;
  border-radius:10px;
  padding:12px;
  margin-top:10px;
}

.pix-key{
  word-break:break-all;
  color:#00d084;
  margin:8px 0;
  font-weight:bold;
}

.copy-btn{
  width:100%;
  background:#00a878;
  color:white;
  border:0;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.hidden{
  display:none;
}

/* PAINEL DO DONO */
#ownerPanel{
  position:fixed;
  inset:0;
  background:#040914;
  z-index:9999;
  overflow:auto;
  padding:15px;
}

.owner-content{
  max-width:600px;
  margin:auto;
}

.owner-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close-owner{
  background:#e53935;
  border:0;
  color:white;
  padding:9px 12px;
  border-radius:8px;
  cursor:pointer;
}

.owner-card{
  background:#0b1428;
  border:1px solid #214574;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
}

.owner-card input,
.owner-card textarea{
  width:100%;
  background:#07101f;
  color:white;
  border:1px solid #29496f;
  padding:10px;
  border-radius:8px;
  margin:6px 0 10px;
}

.owner-card textarea{
  min-height:70px;
  resize:vertical;
}

.owner-save{
  width:100%;
  background:#00a878;
  color:#fff;
  border:0;
  padding:11px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.owner-delete{
  width:100%;
  background:#d93636;
  color:#fff;
  border:0;
  padding:10px;
  border-radius:8px;
  margin-top:8px;
  cursor:pointer;
}

.add-product{
  width:100%;
  background:#087cff;
  color:#fff;
  border:0;
  padding:12px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:15px;
}
</style>
</head>

<body>

<header>
  <!-- TOQUE 5 VEZES AQUI PARA ABRIR A ÁREA DO DONO -->
  <div class="logo" id="secretLogo">⚡ FUSION XIT</div>
  <div class="subtitle">Produtos digitais</div>
</header>

<div class="container">

  <div class="cart-top">
    <strong>🛒 Loja</strong>
    <button class="cart-btn" onclick="openCart()">
      Carrinho (<span id="cartCount">0</span>)
    </button>
  </div>

  <div class="products" id="products"></div>

  <div class="notice">
    ℹ️ Produtos digitais demonstrativos. Confira os detalhes antes da compra.
  </div>

  <div class="section hidden" id="cartSection">
    <h2>🛒 Seu carrinho</h2>

    <div id="cartItems"></div>

    <div class="total">
      <span>Total</span>
      <span id="cartTotal">R$ 0,00</span>
    </div>

    <button class="buy" style="margin-top:12px" onclick="showPix()">
      💳 Pagar via Pix
    </button>
  </div>

  <div class="section hidden" id="pixSection">
    <h2>💚 Pagamento via Pix</h2>

    <p style="color:#9db0cc;font-size:13px">
      Copie a chave Pix abaixo para realizar o pagamento.
    </p>

    <div class="pix-box">
      <div>Chave Pix:</div>

      <div class="pix-key" id="pixKey">
        05942249261
      </div>

      <button class="copy-btn" onclick="copyPix()">
        📋 Copiar chave Pix
      </button>
    </div>
  </div>

</div>

<!-- PAINEL DO DONO: NÃO APARECE NA LOJA -->
<div id="ownerPanel" class="hidden">

  <div class="owner-content">

    <div class="owner-header">
      <h2>🔐 Área do Dono</h2>

      <button class="close-owner" onclick="closeOwner()">
        Fechar
      </button>
    </div>

    <button class="add-product" onclick="addProduct()">
      ➕ Adicionar produto
    </button>

    <div id="ownerProducts"></div>

  </div>

</div>

<script>

/* =========================
   CONFIGURAÇÕES
========================= */

const OWNER_PASSWORD = "1234";

const PIX_KEY = "05942249261";


/* =========================
   PRODUTOS
========================= */

const defaultProducts = [

  {
    name:"🟢 Painel Neon",
    description:"Painel digital demonstrativo.",
    price:5,
    stock:10
  },

  {
    name:"🔵 Painel Boot",
    description:"Painel digital demonstrativo.",
    price:5,
    stock:10
  },

  {
    name:"🟣 Painel VIP",
    description:"Painel digital demonstrativo.",
    price:7,
    stock:10
  },

  {
    name:"🟠 Painel Pro",
    description:"Painel digital demonstrativo.",
    price:10,
    stock:10
  },

  {
    name:"😈 Painel HS",
    description:"Painel digital demonstrativo.",
    price:8,
    stock:10
  },

  {
    name:"🍷 Como criar XIT",
    description:"Conteúdo/tutorial demonstrativo.",
    price:12,
    stock:10
  },

  {
    name:"😶‍🌫️ HS Peito Android",
    description:"Produto digital demonstrativo.",
    price:6,
    stock:10
  },

  {
    name:"😶‍🌫️ HS Peito iOS",
    description:"Produto digital demonstrativo.",
    price:6,
    stock:10
  },

  {
    name:"😈 Proxy Android",
    description:"Produto digital demonstrativo.",
    price:5,
    stock:10
  },

  {
    name:"🗿 Proxy iOS",
    description:"Produto digital demonstrativo.",
    price:5,
    stock:10
  },

  {
    name:"🟡 Licença 7 dias",
    description:"Licença digital demonstrativa.",
    price:3,
    stock:10
  },

  {
    name:"🟡 Licença 30 dias",
    description:"Licença digital demonstrativa.",
    price:8,
    stock:10
  }

];


let products =
  JSON.parse(localStorage.getItem("fusionProducts"))
  || defaultProducts;

let cart =
  JSON.parse(localStorage.getItem("fusionCart"))
  || [];


/* =========================
   FORMATAR PREÇO
========================= */

function money(value){

  return Number(value).toLocaleString("pt-BR",{
    style:"currency",
    currency:"BRL"
  });

}


/* =========================
   SALVAR
========================= */

function saveProducts(){

  localStorage.setItem(
    "fusionProducts",
    JSON.stringify(products)
  );

}

function saveCart(){

  localStorage.setItem(
    "fusionCart",
    JSON.stringify(cart)
  );

}


/* =========================
   MOSTRAR PRODUTOS
========================= */

function renderProducts(){

  const area =
    document.getElementById("products");

  area.innerHTML = "";

  products.forEach((product,index)=>{

    const card =
      document.createElement("div");

    card.className = "card";

    const soldOut =
      Number(product.stock) <= 0;

    card.innerHTML = `

      <h3>${escapeHTML(product.name)}</h3>

      <p>
        ${escapeHTML(product.description)}
      </p>

      <div class="price">
        ${money(product.price)}
      </div>

      <div class="stock">
        Estoque: ${product.stock}
      </div>

      <button
        class="buy"
        ${soldOut ? "disabled" : ""}
        onclick="buyProduct(${index})">

        ${soldOut ? "❌ Esgotado" : "🛒 Comprar"}

      </button>

    `;

    area.appendChild(card);

  });

  updateCartCount();

}


/* =========================
   COMPRAR
========================= */

function buyProduct(index){

  const product =
    products[index];

  if(!product || Number(product.stock) <= 0){
    return;
  }

  cart.push({
    name:product.name,
    price:Number(product.price),
    productIndex:index
  });

  /*
    O estoque é reduzido ao adicionar
    ao carrinho.
  */

  product.stock =
    Number(product.stock) - 1;

  saveProducts();
  saveCart();

  renderProducts();

  alert("✅ Produto adicionado ao carrinho!");

  openCart();

}


/* =========================
   CARRINHO
========================= */

function updateCartCount(){

  document.getElementById("cartCount").textContent =
    cart.length;

}


function openCart(){

  const section =
    document.getElementById("cartSection");

  section.classList.remove("hidden");

  renderCart();

  section.scrollIntoView({
    behavior:"smooth"
  });

}


function renderCart(){

  const area =
    document.getElementById("cartItems");

  area.innerHTML = "";

  let total = 0;

  if(cart.length === 0){

    area.innerHTML =
      `<p style="color:#8fa4c2">
        Seu carrinho está vazio.
      </p>`;

  }

  cart.forEach((item,index)=>{

    total += Number(item.price);

    const div =
      document.createElement("div");

    div.className = "cart-item";

    div.innerHTML = `

      <span>
        ${escapeHTML(item.name)}
      </span>

      <span>
        ${money(item.price)}
      </span>

    `;

    area.appendChild(div);

  });

  document.getElementById("cartTotal").textContent =
    money(total);

  updateCartCount();

}


/* =========================
   PIX
========================= */

function showPix(){

  if(cart.length === 0){

    alert("🛒 Adicione um produto ao carrinho primeiro.");

    return;
  }

  const pix =
    document.getElementById("pixSection");

  pix.classList.remove("hidden");

  pix.scrollIntoView({
    behavior:"smooth"
  });

}


function copyPix(){

  navigator.clipboard.writeText(PIX_KEY)
    .then(()=>{

      alert("✅ Chave Pix copiada!");

    })
    .catch(()=>{

      alert(
        "Copie manualmente a chave: " +
        PIX_KEY
      );

    });

}


/* =========================
   ÁREA SECRETA DO DONO
========================= */

let logoClicks = 0;
let clickTimer = null;


document.getElementById("secretLogo")
.addEventListener("click",function(){

  logoClicks++;

  clearTimeout(clickTimer);

  clickTimer =
    setTimeout(()=>{
      logoClicks = 0;
    },1500);


  if(logoClicks >= 5){

    logoClicks = 0;

    openOwner();

  }

});


function openOwner(){

  const password =
    prompt("🔐 Digite a senha do dono:");

  if(password !== OWNER_PASSWORD){

    alert("❌ Senha incorreta.");

    return;
  }

  document
    .getElementById("ownerPanel")
    .classList.remove("hidden");

  renderOwner();

}


function closeOwner(){

  document
    .getElementById("ownerPanel")
    .classList.add("hidden");

}


/* =========================
   PAINEL DO DONO
========================= */

function renderOwner(){

  const area =
    document.getElementById("ownerProducts");

  area.innerHTML = "";

  products.forEach((product,index)=>{

    const div =
      document.createElement("div");

    div.className = "owner-card";

    div.innerHTML = `

      <strong>
        Produto ${index + 1}
      </strong>

      <label>Nome</label>

      <input
        id="name-${index}"
        value="${escapeAttribute(product.name)}">

      <label>Descrição</label>

      <textarea
        id="desc-${index}">${escapeHTML(product.description)}</textarea>

      <label>Preço</label>

      <input
        id="price-${index}"
        type="number"
        step="0.01"
        min="0"
        value="${Number(product.price)}">

      <label>Estoque</label>

      <input
        id="stock-${index}"
        type="number"
        min="0"
        value="${Number(product.stock)}">

      <button
        class="owner-save"
        onclick="saveProduct(${index})">

        💾 Salvar alterações

      </button>

      <button
        class="owner-delete"
        onclick="deleteProduct(${index})">

        🗑️ Excluir produto

      </button>

    `;

    area.appendChild(div);

  });

}


/* =========================
   SALVAR PRODUTO
========================= */

function saveProduct(index){

  const name =
    document.getElementById(
      `name-${index}`
    ).value.trim();

  const description =
    document.getElementById(
      `desc-${index}`
    ).value.trim();

  const price =
    Number(
      document.getElementById(
        `price-${index}`
      ).value
    );

  const stock =
    Number(
      document.getElementById(
        `stock-${index}`
      ).value
    );


  if(!name){

    alert("Digite o nome do produto.");

    return;
  }


  products[index] = {

    name:name,

    description:description,

    price:isNaN(price) ? 0 : price,

    stock:isNaN(stock) ? 0 : Math.max(0,stock)

  };


  saveProducts();

  renderProducts();

  renderOwner();

  alert("✅ Produto atualizado!");

}


/* =========================
   ADICIONAR PRODUTO
========================= */

function addProduct(){

  products.push({

    name:"🆕 Novo produto",

    description:"Descrição do produto.",

    price:5,

    stock:10

  });

  saveProducts();

  renderProducts();

  renderOwner();

}


/* =========================
   EXCLUIR PRODUTO
========================= */

function deleteProduct(index){

  if(!confirm(
    "Tem certeza que deseja excluir este produto?"
  )){

    return;
  }

  products.splice(index,1);

  saveProducts();

  renderProducts();

  renderOwner();

}


/* =========================
   SEGURANÇA DE TEXTO
========================= */

function escapeHTML(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(text){

  return escapeHTML(text);

}


/* =========================
   INICIALIZAÇÃO
========================= */

document.getElementById("pixKey").textContent =
  PIX_KEY;

renderProducts();

renderCart();

</script>

</body>
</html>
