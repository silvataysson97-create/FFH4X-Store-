<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUSION XIT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050b18;
  color: white;
}

header {
  text-align: center;
  padding: 35px 15px;
  background: #102957;
  border-bottom: 1px solid #1683ff;
}

.logo {
  font-size: 38px;
  font-weight: bold;
  color: #1595ff;
}

.subtitle {
  margin-top: 8px;
  color: #aebbd1;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 25px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 25px;
}

button {
  border: 0;
  border-radius: 14px;
  padding: 15px 22px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.primary {
  background: #1388ff;
  color: white;
}

.green {
  background: #00b982;
  color: white;
}

.red {
  background: #e53935;
  color: white;
}

.card {
  background: #0c1529;
  border: 1px solid #1b477a;
  border-radius: 22px;
  padding: 25px;
  margin-bottom: 20px;
}

.product-name {
  font-size: 25px;
  font-weight: bold;
}

.description {
  color: #aebbd1;
  margin: 12px 0;
}

.price {
  color: #00d99a;
  font-size: 28px;
  font-weight: bold;
  margin: 15px 0;
}

.stock {
  color: #9aaac0;
  margin-bottom: 20px;
}

.buy {
  width: 100%;
  background: #1388ff;
  color: white;
}

.cart {
  background: #0c1529;
  border: 1px solid #1b477a;
  border-radius: 22px;
  padding: 25px;
  margin-top: 30px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #243653;
}

.total {
  display: flex;
  justify-content: space-between;
  font-size: 24px;
  font-weight: bold;
  margin: 22px 0;
}

input, textarea {
  width: 100%;
  padding: 15px;
  margin: 8px 0 18px;
  border-radius: 12px;
  border: 1px solid #294c77;
  background: #071020;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.hidden {
  display: none;
}

.admin-panel {
  background: #090f1d;
  border: 1px solid #875cff;
  border-radius: 22px;
  padding: 25px;
  margin-bottom: 25px;
}

.admin-badge {
  display: inline-block;
  background: #875cff;
  padding: 8px 14px;
  border-radius: 20px;
  margin-bottom: 15px;
}

.notice {
  background: #10233d;
  border-left: 4px solid #1388ff;
  padding: 15px;
  border-radius: 10px;
  margin: 15px 0;
}
</style>
</head>

<body>

<header>
  <div class="logo">⚡ FUSION XIT</div>
  <div class="subtitle">Produtos digitais</div>
</header>

<div class="container">

  <!-- TOPO -->
  <div class="topbar">
    <h2>🛒 Loja</h2>

    <div>
      <button class="primary" onclick="abrirLogin()">
        🔐 Área do Dono
      </button>

      <button class="primary" onclick="mostrarCarrinho()">
        Carrinho (<span id="cartCount">0</span>)
      </button>
    </div>
  </div>

  <!-- PAINEL ADMIN -->
  <div id="adminPanel" class="admin-panel hidden">

    <span class="admin-badge">👑 ADMINISTRADOR</span>

    <h2>Área do Dono</h2>

    <div class="notice">
      Compras feitas por contas autorizadas de administrador são gratuitas.
    </div>

    <h3>🎨 Aparência</h3>

    <label>Nome da loja</label>
    <input id="storeName" value="FUSION XIT">

    <label>Subtítulo</label>
    <input id="storeSubtitle" value="Produtos digitais">

    <button class="green" onclick="salvarAparencia()">
      💾 Salvar aparência
    </button>

    <h3>📦 Produtos</h3>

    <div id="adminProducts"></div>

    <button class="red" onclick="logout()">
      🚪 Sair do painel
    </button>

  </div>

  <!-- PRODUTOS -->
  <div id="products"></div>

  <!-- CARRINHO -->
  <div id="cart" class="cart hidden">

    <h2>🛒 Seu carrinho</h2>

    <div id="cartItems"></div>

    <div class="total">
      <span>Total</span>
      <span id="cartTotal">R$ 0,00</span>
    </div>

    <button class="primary" style="width:100%" onclick="finalizarCompra()">
      💳 Continuar para pagamento
    </button>

    <br><br>

    <button class="red" style="width:100%" onclick="limparCarrinho()">
      🗑️ Limpar carrinho
    </button>

  </div>

</div>


<!-- LOGIN -->
<div id="loginBox" class="hidden"
style="
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:center;
justify-content:center;
padding:20px;
">

  <div class="card" style="width:100%;max-width:400px">

    <h2>🔐 Área do Dono</h2>

    <label>Usuário</label>
    <input id="loginUser" placeholder="Digite o usuário">

    <label>Senha</label>
    <input id="loginPass" type="password" placeholder="Digite a senha">

    <button class="primary" style="width:100%" onclick="login()">
      Entrar
    </button>

    <br><br>

    <button class="red" style="width:100%" onclick="fecharLogin()">
      Fechar
    </button>

  </div>
</div>


<script>

/* =====================================================
   CONFIGURAÇÃO DOS ADMINISTRADORES
   =====================================================

   TROQUE ESTES USUÁRIOS E SENHAS.

   O "dono" também é administrador.
*/

const ADMINS = {
  dono: "123456",
  admin1: "admin123",
  admin2: "admin456"
};


/* =====================================================
   PRODUTOS
   ===================================================== */

let produtos = JSON.parse(localStorage.getItem("fusionProdutos")) || [

  {
    id: 1,
    nome: "🟢 Painel Neon",
    descricao: "Painel digital demonstrativo.",
    preco: 5,
    estoque: 10
  },

  {
    id: 2,
    nome: "🔵 Painel Boot",
    descricao: "Painel digital demonstrativo.",
    preco: 5,
    estoque: 10
  },

  {
    id: 3,
    nome: "🟣 Painel VIP",
    descricao: "Painel digital demonstrativo.",
    preco: 7,
    estoque: 10
  },

  {
    id: 4,
    nome: "🟠 Painel Pro",
    descricao: "Painel digital demonstrativo.",
    preco: 10,
    estoque: 10
  },

  {
    id: 5,
    nome: "🟤 Proxy iOS",
    descricao: "Produto digital demonstrativo.",
    preco: 5,
    estoque: 10
  },

  {
    id: 6,
    nome: "🟡 Licença 7 dias",
    descricao: "Licença digital demonstrativa.",
    preco: 3,
    estoque: 10
  },

  {
    id: 7,
    nome: "🟡 Licença 30 dias",
    descricao: "Licença digital demonstrativa.",
    preco: 8,
    estoque: 10
  }

];


/* =====================================================
   VARIÁVEIS
   ===================================================== */

let carrinho =
JSON.parse(localStorage.getItem("fusionCarrinho")) || [];

let usuarioAtual =
localStorage.getItem("fusionUsuario") || null;


/* =====================================================
   FORMATAÇÃO
   ===================================================== */

function dinheiro(valor) {

  return valor.toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });

}


/* =====================================================
   VERIFICAR ADMIN
   ===================================================== */

function usuarioEhAdmin() {

  if (!usuarioAtual) {
    return false;
  }

  return ADMINS.hasOwnProperty(usuarioAtual);

}


/* =====================================================
   MOSTRAR PRODUTOS
   ===================================================== */

function renderizarProdutos() {

  const area = document.getElementById("products");

  area.innerHTML = "";

  produtos.forEach(produto => {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div class="product-name">
        ${produto.nome}
      </div>

      <div class="description">
        ${produto.descricao}
      </div>

      <div class="price">
        ${dinheiro(produto.preco)}
      </div>

      <div class="stock">
        Estoque: ${produto.estoque}
      </div>

      <button
        class="buy"
        onclick="adicionarCarrinho(${produto.id})">

        🛒 Comprar

      </button>

    `;

    area.appendChild(card);

  });

}


/* =====================================================
   CARRINHO
   ===================================================== */

function adicionarCarrinho(id) {

  const produto = produtos.find(p => p.id === id);

  if (!produto) return;

  if (produto.estoque <= 0) {

    alert("Produto sem estoque.");

    return;

  }

  carrinho.push(produto);

  localStorage.setItem(
    "fusionCarrinho",
    JSON.stringify(carrinho)
  );

  atualizarCarrinho();

  alert("Produto adicionado ao carrinho!");

}


function atualizarCarrinho() {

  document.getElementById("cartCount").textContent =
  carrinho.length;

  const area =
  document.getElementById("cartItems");

  area.innerHTML = "";

  let total = 0;

  carrinho.forEach((produto, index) => {

    total += Number(produto.preco);

    const item =
    document.createElement("div");

    item.className = "cart-item";

    item.innerHTML = `

      <span>${produto.nome}</span>

      <span>

        ${dinheiro(produto.preco)}

        <button
          class="red"
          style="padding:6px 10px;margin-left:5px"
          onclick="removerCarrinho(${index})">

          X

        </button>

      </span>

    `;

    area.appendChild(item);

  });

  document.getElementById("cartTotal").textContent =
  dinheiro(total);

}


function removerCarrinho(index) {

  carrinho.splice(index, 1);

  localStorage.setItem(
    "fusionCarrinho",
    JSON.stringify(carrinho)
  );

  atualizarCarrinho();

}


function limparCarrinho() {

  carrinho = [];

  localStorage.setItem(
    "fusionCarrinho",
    JSON.stringify(carrinho)
  );

  atualizarCarrinho();

}


function mostrarCarrinho() {

  document
  .getElementById("cart")
  .classList.toggle("hidden");

}


/* =====================================================
   FINALIZAR COMPRA
   ===================================================== */

function finalizarCompra() {

  if (carrinho.length === 0) {

    alert("Seu carrinho está vazio.");

    return;

  }


  let total = 0;

  carrinho.forEach(produto => {

    total += Number(produto.preco);

  });


  /*
     AQUI ESTÁ A REGRA PRINCIPAL:

     DONO/ADMIN = R$ 0
     CLIENTE = preço normal
  */

  if (usuarioEhAdmin()) {

    alert(
      "👑 Compra gratuita liberada para administrador!"
    );

    entregarCompraGratis();

    return;

  }


  /*
     CLIENTE NORMAL

     Aqui você coloca o seu sistema Pix.
  */

  alert(
    "💳 Cliente normal.\n\n" +
    "Total: " + dinheiro(total) +
    "\n\n" +
    "Aqui será aberto o pagamento Pix."
  );

}


/* =====================================================
   ENTREGA GRATUITA DO ADMIN
   ===================================================== */

function entregarCompraGratis() {

  let nomes = carrinho
  .map(p => p.nome)
  .join("\n");

  alert(
    "✅ COMPRA ADMINISTRATIVA\n\n" +
    "Usuário: " + usuarioAtual +
    "\n\n" +
    "Produtos:\n" +
    nomes +
    "\n\n" +
    "Total: R$ 0,00"
  );

  carrinho = [];

  localStorage.setItem(
    "fusionCarrinho",
    JSON.stringify(carrinho)
  );

  atualizarCarrinho();

}


/* =====================================================
   LOGIN
   ===================================================== */

function abrirLogin() {

  const box =
  document.getElementById("loginBox");

  box.style.display = "flex";

}


function fecharLogin() {

  document
  .getElementById("loginBox")
  .style.display = "none";

}


function login() {

  const usuario =
  document
  .getElementById("loginUser")
  .value
  .trim()
  .toLowerCase();

  const senha =
  document
  .getElementById("loginPass")
  .value;


  if (
    ADMINS[usuario] &&
    ADMINS[usuario] === senha
  ) {

    usuarioAtual = usuario;

    localStorage.setItem(
      "fusionUsuario",
      usuario
    );

    fecharLogin();

    abrirPainelAdmin();

    alert(
      "👑 Login de administrador realizado!"
    );

  } else {

    alert(
      "❌ Usuário ou senha incorretos."
    );

  }

}


/* =====================================================
   PAINEL ADMIN
   ===================================================== */

function abrirPainelAdmin() {

  if (!usuarioEhAdmin()) {

    alert("Acesso negado.");

    return;

  }

  document
  .getElementById("adminPanel")
  .classList.remove("hidden");

  renderizarAdmin();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function renderizarAdmin() {

  const area =
  document.getElementById("adminProducts");

  area.innerHTML = "";

  produtos.forEach((produto, index) => {

    const div =
    document.createElement("div");

    div.className = "card";

    div.innerHTML = `

      <h3>Produto ${index + 1}</h3>

      <label>Nome</label>

      <input
        id="nome_${produto.id}"
        value="${produto.nome}">

      <label>Descrição</label>

      <textarea
        id="desc_${produto.id}">
${produto.descricao}</textarea>

      <label>Preço</label>

      <input
        type="number"
        id="preco_${produto.id}"
        value="${produto.preco}">

      <label>Estoque</label>

      <input
        type="number"
        id="estoque_${produto.id}"
        value="${produto.estoque}">

      <button
        class="green"
        onclick="salvarProduto(${produto.id})">

        💾 Salvar alterações

      </button>

    `;

    area.appendChild(div);

  });

}


function salvarProduto(id) {

  const produto =
  produtos.find(p => p.id === id);

  if (!produto) return;


  produto.nome =
  document.getElementById(
    "nome_" + id
  ).value;


  produto.descricao =
  document.getElementById(
    "desc_" + id
  ).value;


  produto.preco =
  Number(
    document.getElementById(
      "preco_" + id
    ).value
  );


  produto.estoque =
  Number(
    document.getElementById(
      "estoque_" + id
    ).value
  );


  localStorage.setItem(
    "fusionProdutos",
    JSON.stringify(produtos)
  );


  renderizarProdutos();

  renderizarAdmin();

  alert("✅ Produto atualizado!");

}


/* =====================================================
   APARÊNCIA
   ===================================================== */

function salvarAparencia() {

  const nome =
  document
  .getElementById("storeName")
  .value;

  const subtitle =
  document
  .getElementById("storeSubtitle")
  .value;


  localStorage.setItem(
    "fusionNome",
    nome
  );

  localStorage.setItem(
    "fusionSubtitle",
    subtitle
  );


  document.querySelector(".logo")
  .textContent = "⚡ " + nome;

  document.querySelector(".subtitle")
  .textContent = subtitle;


  alert("🎨 Aparência salva!");

}


function carregarAparencia() {

  const nome =
  localStorage.getItem("fusionNome");

  const subtitle =
  localStorage.getItem("fusionSubtitle");


  if (nome) {

    document.querySelector(".logo")
    .textContent = "⚡ " + nome;

    document.getElementById(
      "storeName"
    ).value = nome;

  }


  if (subtitle) {

    document.querySelector(".subtitle")
    .textContent = subtitle;

    document.getElementById(
      "storeSubtitle"
    ).value = subtitle;

  }

}


/* =====================================================
   LOGOUT
   ===================================================== */

function logout() {

  usuarioAtual = null;

  localStorage.removeItem(
    "fusionUsuario"
  );

  document
  .getElementById("adminPanel")
  .classList.add("hidden");

  alert("Você saiu da Área do Dono.");

}


/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

renderizarProdutos();

atualizarCarrinho();

carregarAparencia();

</script>

</body>
</html>
