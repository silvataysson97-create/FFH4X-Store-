<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFH4X Store</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#07030d;
  color:#fff;
  min-height:100vh;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 10%,#7b00ff33,transparent 35%),
    radial-gradient(circle at 80% 80%,#c000ff22,transparent 35%);
  pointer-events:none;
  z-index:-1;
}

header{
  padding:28px 16px;
  text-align:center;
  background:linear-gradient(180deg,#160025,#09000f);
  border-bottom:1px solid #a100ff66;
  box-shadow:0 0 30px #8a00ff44;
}

.logo{
  font-size:36px;
  font-weight:900;
  color:#d56aff;
  text-shadow:0 0 10px #9d00ff,0 0 30px #9d00ff;
}

.subtitle{
  color:#c9a9d8;
  margin-top:8px;
}

.support{
  display:inline-block;
  margin-top:18px;
  padding:12px 20px;
  border-radius:12px;
  background:#7200ff;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 0 18px #8d00ff;
}

.container{
  width:94%;
  max-width:1100px;
  margin:25px auto;
}

.trust{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:25px;
}

.trust div{
  padding:18px 10px;
  text-align:center;
  background:#110819;
  border:1px solid #9b00ff55;
  border-radius:14px;
  box-shadow:0 0 15px #7800ff22;
}

.trust b{
  display:block;
  color:#d879ff;
  margin-bottom:5px;
}

h2{
  margin:25px 0 15px;
  color:#e08aff;
  text-shadow:0 0 10px #8d00ff;
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card{
  background:linear-gradient(145deg,#170b20,#0c0711);
  border:1px solid #a500ff55;
  border-radius:18px;
  padding:16px;
  box-shadow:0 0 20px #7700ff22;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#c000ff;
  box-shadow:0 0 25px #8d00ff66;
}

.art{
  height:130px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  background:
    radial-gradient(circle,#b900ff55,transparent 45%),
    linear-gradient(135deg,#260044,#09000e);
  border:1px solid #a900ff55;
  margin-bottom:14px;
}

.card h3{
  color:#fff;
  margin-bottom:7px;
}

.desc{
  color:#a995ae;
  font-size:13px;
  min-height:34px;
}

.price{
  font-size:22px;
  font-weight:bold;
  color:#dc72ff;
  margin:12px 0;
}

.stock{
  font-size:13px;
  margin-bottom:12px;
}

.available{
  color:#55ff91;
}

.empty{
  color:#ff4d6d;
  font-weight:bold;
}

.buy{
  width:100%;
  border:0;
  padding:12px;
  border-radius:10px;
  background:linear-gradient(90deg,#7200ff,#b000ff);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 15px #8d00ff55;
}

.buy:disabled{
  background:#302733;
  color:#777;
  cursor:not-allowed;
  box-shadow:none;
}

#checkout{
  display:none;
  margin:35px 0;
  padding:25px;
  border-radius:20px;
  background:linear-gradient(145deg,#180722,#0b0610);
  border:2px solid #a600ff;
  box-shadow:0 0 30px #8d00ff55;
  text-align:center;
}

#checkout.active{
  display:block;
}

#produtoEscolhido{
  color:#e38aff;
  margin:10px 0;
  font-size:18px;
}

.pixBox{
  margin:20px auto;
  max-width:500px;
  padding:18px;
  border-radius:14px;
  background:#08040c;
  border:1px solid #9d00ff77;
}

.pixLabel{
  color:#aaa;
  font-size:13px;
  margin-bottom:8px;
}

.pixKey{
  word-break:break-all;
  font-size:20px;
  font-weight:bold;
  color:#fff;
  margin-bottom:14px;
}

.copy{
  padding:11px 18px;
  border:0;
  border-radius:10px;
  background:#8c00ff;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.whatsapp{
  display:inline-block;
  margin-top:15px;
  padding:13px 20px;
  border-radius:10px;
  background:#19b85a;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}

.notice{
  color:#aaa;
  font-size:12px;
  margin-top:15px;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:#777;
}

@media(max-width:800px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .trust{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:520px){
  .products{
    grid-template-columns:1fr;
  }

  .logo{
    font-size:29px;
  }
}
</style>
</head>
