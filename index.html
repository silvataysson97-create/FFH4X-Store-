<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FFH4X Store</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#26004d 0%,#0b0312 38%,#050207 100%);
    color:white;
    min-height:100vh;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 15% 20%,#a000ff25,transparent 30%),
        radial-gradient(circle at 85% 70%,#d000ff18,transparent 30%);
    z-index:-1;
}

/* HEADER */

header{
    padding:35px 15px;
    text-align:center;
    background:
        linear-gradient(180deg,#200034,#0b0312);
    border-bottom:1px solid #a900ff66;
    box-shadow:0 0 35px #8c00ff55;
}

.logo{
    font-size:38px;
    font-weight:900;
    color:#e08aff;
    text-shadow:
        0 0 8px #a000ff,
        0 0 20px #a000ff,
        0 0 40px #8c00ff;
}

.subtitle{
    margin-top:10px;
    color:#c9a9d5;
    font-size:15px;
}

.support{
    display:inline-block;
    margin-top:20px;
    padding:13px 22px;
    background:linear-gradient(90deg,#6500d9,#b000ff);
    border-radius:12px;
    color:white;
    text-decoration:none;
    font-weight:bold;
    box-shadow:0 0 20px #8c00ff88;
}

/* CONTAINER */

.container{
    width:94%;
    max-width:1150px;
    margin:25px auto;
}

/* BENEFÍCIOS */

.trust{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:30px;
}

.trust-box{
    background:#110817;
    border:1px solid #9d00ff55;
    border-radius:15px;
    padding:18px 10px;
    text-align:center;
    box-shadow:0 0 18px #7d00ff22;
}

.trust-box strong{
    display:block;
    color:#d979ff;
    margin-bottom:6px;
}

/* TITULOS */

.title{
    color:#df83ff;
    margin:28px 0 18px;
    font-size:25px;
    text-shadow:0 0 12px #9700ff;
}

/* PRODUTOS */

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.card{
    background:
        linear-gradient(145deg,#190b24,#09050d);
    border:1px solid #a500ff55;
    border-radius:18px;
    padding:15px;
    box-shadow:0 0 22px #7800ff22;
    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#c000ff;
    box-shadow:0 0 28px #8f00ff66;
}

.image{
    height:140px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;

    background:
        radial-gradient(circle,#b500ff55,transparent 45%),
        linear-gradient(135deg,#300052,#09000e);

    border:1px solid #b000ff55;
    margin-bottom:15px;
}

.card h3{
    font-size:19px;
    margin-bottom:8px;
}

.description{
    color:#aa98b2;
    font-size:13px;
    min-height:38px;
    line-height:1.4;
}

.price{
    margin:12px 0 8px;
    color:#dc75ff;
    font-size:23px;
    font-weight:bold;
}

.stock{
    font-size:13px;
    margin-bottom:13px;
}

.stock-ok{
    color:#55ff91;
}

.stock-out{
    color:#ff4c6d;
}

.buy{
    width:100%;
    border:0;
    border-radius:11px;
    padding:13px;
    background:linear-gradient(90deg,#6800dc,#b000ff);
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 0 15px #8500ff55;
}

.buy:hover{
    box-shadow:0 0 25px #a000ff99;
}

.buy:disabled{
    background:#29212d;
    color:#777;
    box-shadow:none;
    cursor:not-allowed;
}

/* PIX */

#checkout{
    display:none;
    margin:40px 0;
    padding:28px 18px;
    text-align:center;
    border-radius:20px;

    background:
        linear-gradient(145deg,#1b0826,#09050d);

    border:2px solid #a900ff;
    box-shadow:
        0 0 20px #9d00ff55,
        inset 0 0 20px #7300ff18;
}

#checkout.show{
    display:block;
}

.pix-title{
    color:#e28bff;
    font-size:26px;
    margin-bottom:10px;
    text-shadow:0 0 12px #9900ff;
}

.selected{
    margin:15px auto;
    color:#d2bfd9;
}

.selected strong{
    color:#e083ff;
}

.pix-box{
    max-width:520px;
    margin:20px auto;
    padding:20px;
    background:#060309;
    border:1px solid #a400ff66;
    border-radius:15px;
}

.pix-label{
    color:#9e91a4;
    font-size:13px;
    margin-bottom:8px;
}

.pix-key{
    font-size:21px;
    font-weight:bold;
    word-break:break-all;
    margin-bottom:15px;
}

.copy{
    border:0;
    padding:12px 20px;
    border-radius:10px;
    background:#8d00ff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.whatsapp{
    display:inline-block;
    margin-top:15px;
    padding:13px 20px;
    border-radius:10px;
    background:#19b957;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.warning{
    color:#918795;
    font-size:12px;
    margin-top:18px;
}

/* FOOTER */

footer{
    text-align:center;
    padding:35px 15px;
