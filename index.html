<!-- PAGAMENTO PIX -->
<div class="checkout" id="checkout">

  <h2>💜 PAGAMENTO</h2>

  <div class="selected">
    Você selecionou:
    <strong id="produtoSelecionado"></strong>
    <br><br>
    Valor:
    <strong>R$ <span id="valorSelecionado"></span></strong>
  </div>

  <div class="pix-box">

    <div class="pix-title">
      💠 PAGUE AGORA VIA PIX
    </div>

    <p style="margin-top:12px;color:#aaa">
      Copie a chave Pix abaixo:
    </p>

    <div class="pix-key" id="pix">
      05942249261
    </div>

    <button class="action copy" onclick="copiarPix()">
      📋 COPIAR CHAVE PIX
    </button>

  </div>

  <a
    class="action whatsapp"
    id="comprovante"
    href="#"
    target="_blank">
    📲 JÁ PAGUEI — ENVIAR COMPROVANTE
  </a>

  <p class="note">
    Depois de fazer o Pix, envie o comprovante pelo WhatsApp
    para confirmar seu pedido.
  </p>

</div>

<script>

function comprar(nome, preco){

  // Mostra o produto escolhido
  document.getElementById("produtoSelecionado").innerText = nome;

  // Mostra o preço
  document.getElementById("valorSelecionado").innerText = preco;

  // Mensagem automática para o WhatsApp
  const mensagem =
    "Olá! Quero comprar " +
    nome +
    " por R$ " +
    preco +
    ". Já fiz o pagamento via Pix e vou enviar o comprovante.";

  const whatsapp =
    "https://wa.me/556992275175?text=" +
    encodeURIComponent(mensagem);

  document.getElementById("comprovante").href = whatsapp;

  // ABRE A ÁREA DO PIX
  const checkout = document.getElementById("checkout");

  checkout.style.display = "block";

  checkout.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function copiarPix(){

  const chavePix =
    "05942249261";

  navigator.clipboard.writeText(chavePix)
    .then(function(){
      alert("✅ Chave Pix copiada!");
    })
    .catch(function(){
      alert("Chave Pix: " + chavePix);
    });

}

</script>
